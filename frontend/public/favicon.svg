<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="caissaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006233" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Icon Background -->
  <rect width="64" height="64" rx="16" fill="url(#caissaBg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Store Front / POS Register Icon -->
  <g filter="url(#shadow)" transform="translate(13, 13)">
    <!-- Store Roof Awning -->
    <path d="M4 14 L8 4 L30 4 L34 14 Z" fill="#ffffff" />
    <!-- Scalloped Awning Edge -->
    <path d="M4 14 Q7 18 10 14 Q13 18 16 14 Q19 18 22 14 Q25 18 28 14 Q31 18 34 14 L34 12 L4 12 Z" fill="#ffffff" />
    <!-- Gold Awning Stripes -->
    <path d="M10 4 L12 14 L16 14 L14 4 Z" fill="url(#goldAccent)" />
    <path d="M22 4 L24 14 L28 14 L26 4 Z" fill="url(#goldAccent)" />

    <!-- POS Counter Building Body -->
    <rect x="7" y="16" width="24" height="18" rx="3" fill="#ffffff" />

    <!-- Glass Display / Screen -->
    <rect x="10" y="19" width="8" height="7" rx="1.5" fill="#006233" />
    <circle cx="14" cy="22.5" r="1.5" fill="#10b981" />

    <!-- POS Door / Cash Drawer -->
    <rect x="20" y="19" width="8" height="15" rx="1.5" fill="#006233" />
    <circle cx="26" cy="26" r="1" fill="url(#goldAccent)" />

    <!-- Base Ledger Line -->
    <rect x="5" y="32" width="28" height="2.5" rx="1.2" fill="url(#goldAccent)" />
  </g>
</svg>